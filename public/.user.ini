; PHP limits for FaithFellows on shared hosting. PHP reads this file from the folder of index.php.
; Church staff may upload audio up to 150 MB and video up to 200 MB in one form, and the platform admin songs up to 400 MB (those travel in
; small pieces, so they do not depend on these). If the host ignores this file, set the same values in hPanel > PHP Configuration.
upload_max_filesize = 420M
post_max_size = 440M
max_execution_time = 900
max_input_time = 900
