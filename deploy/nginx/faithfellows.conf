# FaithFellows — nginx site (Ubuntu 22.04/24.04, PHP 8.2-FPM)
# /etc/nginx/sites-available/faithfellows.conf  →  ln -s into sites-enabled
#
# Serves:
#   faithfellows.app              (marketing site, member app, admin)
#   *.faithfellows.app            (auto-generated church websites)
#   custom church domains         (default_server block at the bottom)
#
# TLS: wildcard certificate via certbot DNS challenge, e.g.
#   certbot certonly --dns-cloudflare --dns-cloudflare-credentials /root/cf.ini \
#     -d faithfellows.app -d '*.faithfellows.app'

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream faithfellows_php {
    server unix:/run/php/php8.2-fpm.sock;
}

# HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name faithfellows.app *.faithfellows.app;

    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name faithfellows.app www.faithfellows.app *.faithfellows.app;

    root /var/www/faithfellows/current/public;
    index index.php;
    charset utf-8;

    ssl_certificate     /etc/letsencrypt/live/faithfellows.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/faithfellows.app/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;

    # Sermon audio/video and church media uploads (matches FF_MAX_UPLOAD_MB).
    client_max_body_size 210M;
    client_body_timeout 300s;

    # Real client IPs from Cloudflare (keep the list current: https://www.cloudflare.com/ips/).
    # set_real_ip_from 173.245.48.0/20; ... real_ip_header CF-Connecting-IP;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # Fingerprinted Vite assets: cache forever.
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location ~* \.(?:ico|png|jpe?g|webp|gif|svg|woff2?)$ {
        expires 30d;
        access_log off;
        try_files $uri /index.php?$query_string;
    }

    # The service worker must never be cached long, or updates never reach phones.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }

    location ~ \.php$ {
        fastcgi_pass faithfellows_php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 120s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # Laravel Reverb (only when BROADCAST_CONNECTION=reverb).
    location /app {
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_pass http://127.0.0.1:8080;
    }

    location ~ /\.(?!well-known).* { deny all; }
}

# Custom church domains (e.g. www.gracelira.org) — the app resolves the church
# from the Host header (ResolveCustomDomain). Issue certificates per domain with
# certbot --nginx -d www.gracelira.org once the church's DNS points here.
server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;

    root /var/www/faithfellows/current/public;
    index index.php;

    ssl_certificate     /etc/letsencrypt/live/faithfellows.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/faithfellows.app/privkey.pem;

    client_max_body_size 20M;

    location / { try_files $uri $uri/ /index.php?$query_string; }

    location ~ \.php$ {
        fastcgi_pass faithfellows_php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ /\.(?!well-known).* { deny all; }
}
