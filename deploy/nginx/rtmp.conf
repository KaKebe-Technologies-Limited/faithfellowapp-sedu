# Self-hosted live streaming (STREAMING_PROVIDER=self_hosted)
# Requires libnginx-mod-rtmp:  apt install libnginx-mod-rtmp
# Include from /etc/nginx/nginx.conf at the TOP level (not inside http {}):
#   include /etc/nginx/rtmp.conf;
#
# Churches stream from OBS to  rtmp://live.faithfellows.app/live  with their
# stream key. nginx asks the app whether the key is valid (on_publish) and
# tells it when the stream stops (on_publish_done). Viewers get HLS from
# https://live.faithfellows.app/hls/{key}.m3u8 (STREAMING_HLS_BASE_URL).

rtmp {
    server {
        listen 1935;
        chunk_size 4096;
        notify_method post;

        application live {
            live on;
            record off;

            # Only keys the app knows may publish (403 otherwise).
            on_publish      https://faithfellows.app/webhooks/rtmp/publish;
            on_publish_done https://faithfellows.app/webhooks/rtmp/done;

            # Nobody may pull RTMP directly; viewers use HLS.
            deny play all;

            hls on;
            hls_path /var/www/hls;
            hls_fragment 4s;
            hls_playlist_length 60s;
            hls_cleanup on;

            # Low-bandwidth audio-only rendition is produced by the player
            # falling back to the lowest bitrate; add ffmpeg exec_push here
            # for true multi-bitrate if the server has CPU to spare.
        }
    }
}

