; FaithFellows background workers — /etc/supervisor/conf.d/faithfellows.conf
; supervisorctl reread && supervisorctl update && supervisorctl start faithfellows:*
;
; Queues carry: notification fan-out (NotifyChurchMembers), queued mail,
; quiet-hours-delayed push/SMS, receipts (PDF), transcription jobs.
; Size numprocs to the server: 2 workers per CPU core is a good start.

[group:faithfellows]
programs=faithfellows-worker,faithfellows-reverb

[program:faithfellows-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/faithfellows/current/artisan queue:work --sleep=3 --tries=3 --backoff=30 --max-time=3600 --memory=256
directory=/var/www/faithfellows/current
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=4
redirect_stderr=true
stdout_logfile=/var/www/faithfellows/shared/storage/logs/worker.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
stopwaitsecs=3600

; Real-time WebSockets (only when BROADCAST_CONNECTION=reverb). Remove from the
; group above if you broadcast through Pusher or not at all.
[program:faithfellows-reverb]
command=php /var/www/faithfellows/current/artisan reverb:start --host=127.0.0.1 --port=8080
directory=/var/www/faithfellows/current
autostart=true
autorestart=true
user=www-data
redirect_stderr=true
stdout_logfile=/var/www/faithfellows/shared/storage/logs/reverb.log
stdout_logfile_maxbytes=10MB
